<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pagina non disponibile · Nippon Club</title>
<link rel="icon" type="image/png" href="static/img/icona-192.png">
<style>
  :root { --accent: #b3202a; --testo: #1b1b1f; --sfondo: #f6f5f3; --card: #fff; --linea: #e3e0db; --muted: #666a73; }
  @media (prefers-color-scheme: dark) { :root { --testo: #f1f0ee; --sfondo: #151517; --card: #202024; --linea: #34343a; --muted: #a8abb3; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--sfondo); color: var(--testo); line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 1.2rem 1rem 3rem; }
  .marchio { display: flex; align-items: center; gap: .6rem; font-weight: 700; margin: .4rem 0 1rem; }
  .marchio .logo { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 1.4rem; }
  h1 { font-size: 1.6rem; margin: .2rem 0 .4rem; }
  h2 { font-size: 1.1rem; margin: 1.8rem 0 .6rem; }
  p { margin: .5rem 0; }
  .muted { color: var(--muted); }
  .avviso { background: #fff4c2; color: #5b4300; border-radius: 12px; padding: .7rem .9rem; margin: 1rem 0; font-size: .95rem; }
  @media (prefers-color-scheme: dark) { .avviso { background: #3a3000; color: #ffe58a; } }
  .ruoli { display: grid; gap: .7rem; margin: 1rem 0; }
  a.ruolo, a.doc { display: flex; flex-direction: column; gap: .15rem; padding: .85rem 1rem; border: 1px solid var(--linea); border-radius: 14px; background: var(--card); color: inherit; text-decoration: none; }
  a.ruolo:hover, a.doc:hover { border-color: var(--accent); }
  a.ruolo strong, a.doc strong { font-size: 1.05rem; }
  a.ruolo span, a.doc span { color: var(--muted); font-size: .88rem; }
  .btn { display: inline-block; margin-top: .8rem; padding: .55rem 1.1rem; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; border: 0; font: inherit; cursor: pointer; }
  footer { margin-top: 2.2rem; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body><main>
<div class="marchio"><span class="logo" aria-hidden="true">空</span><span>ASD Nippon Club</span></div>
<h1>Questa pagina non è nella demo</h1>
<p>Questa è una <strong>demo statica in sola lettura</strong>: contiene le schermate principali già preparate, non tutte le combinazioni possibili (filtri, ricerche, azioni).</p>
<p>Nella versione completa del programma questa pagina funziona.</p>
<p><button class="btn" id="indietro" type="button">Torna indietro</button> &nbsp; <a href="index.html">Cambia ruolo</a></p>
<script src="demo/indietro.js"></script>
</main></body></html>
